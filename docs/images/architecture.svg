<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="540" viewBox="0 0 1150 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1150" height="540" rx="16" fill="#ffffff"/>
  <text x="575" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AWS S3 → Snowflake RAW → dbt SILVER → dbt GOLD</text>

  <!-- phase labels -->
  <text x="342" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">INGESTION · SQL run in a Snowflake worksheet</text>
  <text x="922" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#FF694B">TRANSFORMATION · dbt-snowflake (dbt build)</text>

  <!-- ===== Box 1 : AWS S3 ===== -->
  <rect x="20" y="80" width="180" height="330" rx="12" fill="#ffffff" stroke="#E8890C" stroke-width="2"/>
  <rect x="20" y="80" width="180" height="44" rx="12" fill="#E8890C"/>
  <rect x="20" y="102" width="180" height="22" fill="#E8890C"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">AWS S3</text>
  <text x="110" y="116" text-anchor="middle" font-size="10.5" fill="#ffffff">source files (CSV)</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">
    <text x="32" y="148" fill="#64748b">s3://&lt;bucket&gt;/</text>
    <text x="32" y="166" fill="#64748b">banking_csv/CSV FILES/</text>
    <text x="32" y="196" fill="#1e293b">customer.csv</text>
    <text x="32" y="218" fill="#1e293b">branch.csv</text>
    <text x="32" y="240" fill="#1e293b">product.csv</text>
    <text x="32" y="262" fill="#1e293b">account.csv</text>
    <text x="32" y="284" fill="#1e293b">card.csv</text>
    <text x="32" y="306" fill="#1e293b">hist_transactional.csv</text>
  </g>
  <text x="110" y="392" text-anchor="middle" font-size="11" fill="#64748b">6 files</text>

  <!-- ===== Box 2 : Stage ===== -->
  <rect x="252" y="80" width="180" height="330" rx="12" fill="#ffffff" stroke="#1A8FC4" stroke-width="2"/>
  <rect x="252" y="80" width="180" height="44" rx="12" fill="#1A8FC4"/>
  <rect x="252" y="102" width="180" height="22" fill="#1A8FC4"/>
  <text x="342" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">External stage</text>
  <text x="342" y="116" text-anchor="middle" font-size="10.5" fill="#ffffff">Snowflake</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#1e293b">
    <text x="264" y="148" font-weight="700">@RAW.banking_stage</text>
    <text x="264" y="170">URL = S3 prefix</text>
    <text x="264" y="192">CREDENTIALS = IAM key</text>
    <text x="264" y="226" font-weight="700">FILE_FORMAT</text>
    <text x="264" y="248">RAW.csv_format</text>
    <text x="264" y="270">· TYPE = CSV</text>
    <text x="264" y="292">· SKIP_HEADER = 1</text>
    <text x="264" y="314">· enclosed by "</text>
    <text x="264" y="336">· '' / NULL → NULL</text>
  </g>
  <text x="342" y="392" text-anchor="middle" font-size="11" fill="#64748b">LIST @stage → 6 files</text>

  <!-- ===== Box 3 : RAW ===== -->
  <rect x="484" y="80" width="180" height="330" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="484" y="80" width="180" height="44" rx="12" fill="#475569"/>
  <rect x="484" y="102" width="180" height="22" fill="#475569"/>
  <text x="574" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">RAW (bronze)</text>
  <text x="574" y="116" text-anchor="middle" font-size="10.5" fill="#ffffff">BANKING_DATA.RAW</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#1e293b">
    <text x="496" y="152">CUSTOMER</text>           <text x="652" y="152" text-anchor="end" fill="#64748b">50</text>
    <text x="496" y="174">BRANCH</text>             <text x="652" y="174" text-anchor="end" fill="#64748b">30</text>
    <text x="496" y="196">PRODUCT</text>            <text x="652" y="196" text-anchor="end" fill="#64748b">15</text>
    <text x="496" y="218">ACCOUNT</text>            <text x="652" y="218" text-anchor="end" fill="#64748b">150</text>
    <text x="496" y="240">CARD</text>               <text x="652" y="240" text-anchor="end" fill="#64748b">60</text>
    <text x="496" y="262">HIST_TRANSACTIONAL</text> <text x="652" y="262" text-anchor="end" fill="#64748b">400</text>
  </g>
  <text x="574" y="300" text-anchor="middle" font-size="10.5" fill="#64748b">rows per table</text>
  <text x="574" y="392" text-anchor="middle" font-size="11" fill="#64748b">loaded by COPY INTO</text>

  <!-- ===== Box 4 : SILVER ===== -->
  <rect x="716" y="80" width="180" height="330" rx="12" fill="#ffffff" stroke="#5B6B7D" stroke-width="2"/>
  <rect x="716" y="80" width="180" height="44" rx="12" fill="#5B6B7D"/>
  <rect x="716" y="102" width="180" height="22" fill="#5B6B7D"/>
  <text x="806" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SILVER</text>
  <text x="806" y="116" text-anchor="middle" font-size="10.5" fill="#ffffff">dbt staging · 1:1 copy</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#1e293b">
    <text x="728" y="152">stg_customer</text>
    <text x="728" y="174">stg_branch</text>
    <text x="728" y="196">stg_product</text>
    <text x="728" y="218">stg_account *</text>
    <text x="728" y="240">stg_card</text>
    <text x="728" y="262">stg_hist_transactional *</text>
  </g>
  <text x="728" y="300" font-size="10.5" fill="#64748b">* incremental</text>
  <text x="728" y="318" font-size="10.5" fill="#64748b">  account → merge</text>
  <text x="728" y="336" font-size="10.5" fill="#64748b">  hist → append</text>
  <text x="806" y="392" text-anchor="middle" font-size="11" fill="#64748b">BANKING_DATA.SILVER</text>

  <!-- ===== Box 5 : GOLD ===== -->
  <rect x="948" y="80" width="180" height="330" rx="12" fill="#ffffff" stroke="#9A6B12" stroke-width="2"/>
  <rect x="948" y="80" width="180" height="44" rx="12" fill="#9A6B12"/>
  <rect x="948" y="102" width="180" height="22" fill="#9A6B12"/>
  <text x="1038" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GOLD</text>
  <text x="1038" y="116" text-anchor="middle" font-size="10.5" fill="#ffffff">dbt marts · business-ready</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#1e293b">
    <text x="958" y="152">dim_product</text>
    <text x="958" y="174">dim_card</text>
    <text x="958" y="196">fct_casa_ratio</text>
    <text x="958" y="218">fct_loan_to_deposit_ratio</text>
  </g>
  <text x="958" y="256" font-size="10.5" fill="#64748b">KPIs per branch +</text>
  <text x="958" y="274" font-size="10.5" fill="#64748b">one ALL_BRANCHES row</text>
  <text x="1038" y="392" text-anchor="middle" font-size="11" fill="#64748b">BANKING_DATA.GOLD</text>

  <!-- ===== Arrows ===== -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="204" y1="245" x2="248" y2="245"/>
    <line x1="436" y1="245" x2="480" y2="245"/>
    <line x1="668" y1="245" x2="712" y2="245"/>
    <line x1="900" y1="245" x2="944" y2="245"/>
  </g>
  <g font-size="10" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="226" y="222">reads</text>  <text x="226" y="234">via key</text>
    <text x="458" y="222">COPY</text>   <text x="458" y="234">INTO</text>
    <text x="690" y="222" fill="#FF694B">dbt</text> <text x="690" y="234" fill="#FF694B">source()</text>
    <text x="922" y="222" fill="#FF694B">dbt</text> <text x="922" y="234" fill="#FF694B">ref()</text>
  </g>

  <!-- ===== Bottom bands ===== -->
  <rect x="20" y="440" width="412" height="80" rx="10" fill="#FFF7ED" stroke="#E8890C" stroke-dasharray="5 4"/>
  <text x="36" y="464" font-size="13" font-weight="700" fill="#9A3412">AWS IAM user · snowflake-s3-reader</text>
  <text x="36" y="484" font-size="12" fill="#1e293b">Read-only policy on s3://&lt;bucket&gt;/banking_csv/*</text>
  <text x="36" y="504" font-size="12" fill="#1e293b">Access key ID + Secret key → stage CREDENTIALS</text>

  <rect x="484" y="440" width="644" height="80" rx="10" fill="#F0F9FF" stroke="#1A8FC4" stroke-dasharray="5 4"/>
  <text x="500" y="464" font-size="13" font-weight="700" fill="#075985">Snowflake access · ACADEMY_ROLE</text>
  <text x="500" y="484" font-size="12" fill="#1e293b">Owns database BANKING_DATA (RAW, SILVER, GOLD) · USAGE + OPERATE on warehouse COMPUTE_WH</text>
  <text x="500" y="504" font-size="12" fill="#1e293b">dbt-snowflake logs in as your user with this role (profiles.yml + .env)</text>
</svg>
