<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="490" rx="16" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">dbt lineage · RAW → SILVER → GOLD</text>

  <text x="140" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">RAW · sources</text>
  <text x="510" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B7D">SILVER · staging</text>
  <text x="875" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#9A6B12">GOLD · marts</text>

  <!-- edges: sources -> staging -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="250" y1="112" x2="386" y2="112"/>
    <line x1="250" y1="172" x2="386" y2="172"/>
    <line x1="250" y1="232" x2="386" y2="232"/>
    <line x1="250" y1="292" x2="386" y2="292"/>
    <line x1="250" y1="352" x2="386" y2="352"/>
    <line x1="250" y1="412" x2="386" y2="412"/>
  </g>

  <!-- edges: staging -> marts -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M630,172 C700,172 700,132 766,132"/>  <!-- branch  -> casa -->
    <path d="M630,172 C700,172 700,202 766,202"/>  <!-- branch  -> ltd  -->
    <path d="M630,232 C700,232 700,132 766,132"/>  <!-- account -> casa -->
    <path d="M630,232 C700,232 700,202 766,202"/>  <!-- account -> ltd  -->
    <path d="M630,232 C700,232 700,292 766,292"/>  <!-- account -> dim_card -->
    <path d="M630,292 L766,292"/>                  <!-- card    -> dim_card -->
    <path d="M630,352 L766,352"/>                  <!-- product -> dim_product -->
  </g>

  <!-- source nodes -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1e293b">
    <rect x="30" y="90"  width="220" height="44" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="46" y="117">RAW.CUSTOMER</text>
    <rect x="30" y="150" width="220" height="44" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="46" y="177">RAW.BRANCH</text>
    <rect x="30" y="210" width="220" height="44" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="46" y="237">RAW.ACCOUNT</text>
    <rect x="30" y="270" width="220" height="44" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="46" y="297">RAW.CARD</text>
    <rect x="30" y="330" width="220" height="44" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="46" y="357">RAW.PRODUCT</text>
    <rect x="30" y="390" width="220" height="44" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="46" y="417">RAW.HIST_TRANSACTIONAL</text>
  </g>

  <!-- staging nodes -->
  <g>
    <rect x="390" y="90"  width="240" height="44" rx="8" fill="#F8FAFC" stroke="#5B6B7D"/>
    <rect x="390" y="150" width="240" height="44" rx="8" fill="#F8FAFC" stroke="#5B6B7D"/>
    <rect x="390" y="210" width="240" height="44" rx="8" fill="#F8FAFC" stroke="#5B6B7D" stroke-width="2"/>
    <rect x="390" y="270" width="240" height="44" rx="8" fill="#F8FAFC" stroke="#5B6B7D"/>
    <rect x="390" y="330" width="240" height="44" rx="8" fill="#F8FAFC" stroke="#5B6B7D"/>
    <rect x="390" y="390" width="240" height="44" rx="8" fill="#F8FAFC" stroke="#5B6B7D" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1e293b">
    <text x="404" y="109">stg_customer</text>
    <text x="404" y="169">stg_branch</text>
    <text x="404" y="229">stg_account</text>
    <text x="404" y="289">stg_card</text>
    <text x="404" y="349">stg_product</text>
    <text x="404" y="409">stg_hist_transactional</text>
  </g>
  <g font-size="10" fill="#64748b">
    <text x="404" y="125">table</text>
    <text x="404" y="185">table</text>
    <text x="404" y="245" fill="#b45309">incremental · merge on account_id</text>
    <text x="404" y="305">table</text>
    <text x="404" y="365">table</text>
    <text x="404" y="425" fill="#b45309">incremental · append on tran_date</text>
  </g>

  <!-- mart nodes -->
  <g>
    <rect x="770" y="110" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#9A6B12"/>
    <rect x="770" y="180" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#9A6B12"/>
    <rect x="770" y="270" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#9A6B12"/>
    <rect x="770" y="330" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#9A6B12"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1e293b">
    <text x="782" y="129">fct_casa_ratio</text>
    <text x="782" y="199">fct_loan_to_deposit_ratio</text>
    <text x="782" y="289">dim_card</text>
    <text x="782" y="349">dim_product</text>
  </g>
  <g font-size="10" fill="#64748b">
    <text x="782" y="145">CASA ratio per branch + total</text>
    <text x="782" y="215">loans ÷ deposits per branch + total</text>
    <text x="782" y="305">card + customer / branch / product</text>
    <text x="782" y="365">category, CASA / Term / Loan group</text>
  </g>

  <text x="500" y="468" text-anchor="middle" font-size="11.5" fill="#64748b">stg_customer and stg_hist_transactional have no mart yet · fct_* models use open accounts only (acct_cls_flg = 'N')</text>
</svg>
